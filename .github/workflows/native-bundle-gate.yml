name: Native bundle smoke

on:
  pull_request:
    branches:
      - master

concurrency:
  group: native-bundle-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DART_ANALYTICS_DISABLED: "true"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  classify:
    name: Detect native source and bundle changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bundle: ${{ steps.changes.outputs.bundle }}
      source: ${{ steps.changes.outputs.source }}
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
          persist-credentials: false

      - name: Validate Unix process supervisor
        shell: bash
        run: python3 tool/test/run_with_timeout_test.py

      - name: Validate native notice synchronization
        shell: bash
        run: python3 tool/test/sync_native_notices_from_candidate_test.py

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          bundle=false
          source=false
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" && "$HEAD_REF" == bot/native-bundle ]]; then
            bundle=true
          fi

          changed_paths="$(mktemp)"
          trap 'rm -f "$changed_paths"' EXIT
          git diff --no-renames --name-only --diff-filter=ACMRTD -z \
            "$BASE_SHA...$HEAD_SHA" > "$changed_paths"

          while IFS= read -r -d '' path; do
            case "$path" in
              .gitattributes|\
              native/CMakeLists.txt|\
              native/dependencies.lock.json|\
              native/include/*|\
              native/src/*|\
              native/platform/*|\
              native/patches/*|\
              native/test/*|\
              tool/native.dart|\
              tool/native.ps1|\
              tool/native.sh|\
              tool/test-sample.ps1|\
              tool/test-sample.sh|\
              tool/test-suspension.ps1|\
              tool/test-suspension.sh|\
              tool/run_with_timeout.py|\
              tool/test/run_with_timeout_test.py|\
              tool/test/sync_native_notices_from_candidate_test.py|\
              tool/src/native_builder.dart|\
              .github/workflows/native-bundle-build.yml|\
              .github/workflows/native-bundle-gate.yml|\
              .github/workflows/native-bundle-generate.yml|\
              .github/scripts/overlay-native-artifacts.sh|\
              .github/scripts/sync-native-notices-from-candidate.sh)
                source=true
                ;;
              .lfsconfig|\
              THIRD_PARTY_NOTICES.md|\
              native/artifacts.manifest.json|\
              packages/simple_torrent_windows/THIRD_PARTY_NOTICES.md|\
              packages/simple_torrent_windows/windows/lib/*|\
              packages/simple_torrent_windows/windows/include/*|\
              packages/simple_torrent_android/THIRD_PARTY_NOTICES.md|\
              packages/simple_torrent_android/android/src/main/jniLibs/*|\
              packages/simple_torrent_android/android/src/main/cpp/include/*|\
              packages/simple_torrent_ios/THIRD_PARTY_NOTICES.md|\
              packages/simple_torrent_ios/ios/simple_torrent_ios/Frameworks/SimpleTorrentNative.xcframework/*|\
              packages/simple_torrent_macos/THIRD_PARTY_NOTICES.md|\
              packages/simple_torrent_macos/macos/simple_torrent_macos/Frameworks/SimpleTorrentNative.xcframework/*)
                bundle=true
                ;;
            esac
          done < "$changed_paths"

          if [[ "$source" == true && "$bundle" == true ]]; then
            echo 'A pull request may not mix canonical native inputs with generated bundle files.' >&2
            exit 65
          fi

          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"

  build-candidate:
    name: Build candidate native bundle
    needs: classify
    if: needs.classify.outputs.source == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/native-bundle-build.yml
    with:
      source_sha: ${{ github.sha }}

  smoke:
    name: Native bundle smoke (${{ matrix.platform }})
    needs:
      - classify
      - build-candidate
    if: >-
      always() &&
      needs.classify.result == 'success' &&
      (needs.classify.outputs.bundle == 'true' ||
       (needs.classify.outputs.source == 'true' &&
        needs.build-candidate.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            # Exercise the bundle on the current GA Windows/Visual Studio image.
            runner: windows-latest
          - platform: android
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-26
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Download candidate native bundle
        if: needs.classify.outputs.source == 'true'
        uses: actions/download-artifact@v4
        with:
          name: native-bundle-candidate
          path: .native-bundle-candidate

      - name: Install candidate native bundle
        if: needs.classify.outputs.source == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD/.native-bundle-candidate"
          bash .github/scripts/overlay-native-artifacts.sh "$candidate"
          install -m 0644 "$candidate/native/artifacts.manifest.json" native/artifacts.manifest.json
          bash .github/scripts/sync-native-notices-from-candidate.sh "$candidate"

          binary_count=0
          binary_paths="$(mktemp)"
          trap 'rm -f "$binary_paths"' EXIT
          find \
            packages/simple_torrent_windows/windows/lib \
            packages/simple_torrent_android/android/src/main/jniLibs \
            packages/simple_torrent_ios/ios/simple_torrent_ios/Frameworks/SimpleTorrentNative.xcframework \
            packages/simple_torrent_macos/macos/simple_torrent_macos/Frameworks/SimpleTorrentNative.xcframework \
            -type f \( -name '*.dll' -o -name '*.lib' -o -name '*.so' -o -name '*.a' \) \
            -print0 > "$binary_paths"
          while IFS= read -r -d '' file; do
            path="${file#./}"
            ((binary_count += 1))
            [[ "$(git check-attr filter -- "$path" | awk '{print $3}')" == lfs ]] || {
              echo "Candidate binary is not covered by a Git LFS rule: $path" >&2
              exit 65
            }
          done < "$binary_paths"
          (( binary_count > 0 )) || { echo 'Candidate contains no generated binaries.' >&2; exit 65; }

      - name: Fetch and validate platform Git LFS objects
        if: needs.classify.outputs.bundle == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.platform }}' in
            windows) prefix='packages/simple_torrent_windows/windows/lib' ;;
            android) prefix='packages/simple_torrent_android/android/src/main/jniLibs' ;;
            macos) prefix='packages/simple_torrent_macos/macos/simple_torrent_macos/Frameworks/SimpleTorrentNative.xcframework' ;;
            ios) prefix='packages/simple_torrent_ios/ios/simple_torrent_ios/Frameworks/SimpleTorrentNative.xcframework' ;;
            *) echo 'Unknown smoke platform.' >&2; exit 64 ;;
          esac
          git lfs install --local
          expected_binaries=()
          tree_paths="$(mktemp)"
          trap 'rm -f "$tree_paths"' EXIT
          git ls-tree -r -z --name-only HEAD -- "$prefix" > "$tree_paths"
          while IFS= read -r -d '' file; do
            case "$file" in
              *.dll|*.lib|*.so|*.a) expected_binaries+=("$file") ;;
            esac
          done < "$tree_paths"
          (( ${#expected_binaries[@]} > 0 )) || { echo "No native binaries found below $prefix." >&2; exit 65; }
          for file in "${expected_binaries[@]}"; do
            [[ "$(git check-attr --cached filter -- "$file" | awk '{print $3}')" == lfs ]] || {
              echo "Committed binary is not covered by Git LFS: $file" >&2
              exit 65
            }
            git show "HEAD:$file" | git lfs pointer --check --strict --stdin || {
              echo "Committed binary is not a canonical Git LFS pointer: $file" >&2
              exit 65
            }
          done
          git lfs pull --include="$prefix/**" --exclude=""
          for file in "${expected_binaries[@]}"; do
            expected="$(git show "HEAD:$file")"
            # `git lfs pointer --file` prefixes the canonical three-line
            # pointer with a human-readable heading; compare only the pointer.
            actual="$(git lfs pointer --file="$file" 2>/dev/null | tail -n 3)"
            [[ "$actual" == "$expected" ]] || { echo "LFS content mismatch: $file" >&2; exit 65; }
          done

      - name: Enable repository shell tools
        if: matrix.platform != 'windows'
        shell: bash
        run: chmod +x tool/native.sh tool/test-sample.sh tool/test-suspension.sh

      - name: Read pinned toolchains (Windows)
        if: matrix.platform == 'windows'
        id: windows_toolchains
        shell: pwsh
        run: |
          $lock = Get-Content native/dependencies.lock.json -Raw | ConvertFrom-Json
          "flutter=$($lock.toolchains.flutter)" >> $env:GITHUB_OUTPUT
          "cmake=$($lock.toolchains.cmake)" >> $env:GITHUB_OUTPUT
          "ninja=$($lock.toolchains.ninja)" >> $env:GITHUB_OUTPUT
          "msvc=$($lock.toolchains.msvcToolset)" >> $env:GITHUB_OUTPUT
          "windows_sdk=$($lock.toolchains.windowsSdk)" >> $env:GITHUB_OUTPUT

      - name: Read pinned toolchains (Unix)
        if: matrix.platform != 'windows'
        id: unix_toolchains
        shell: bash
        run: |
          set -euo pipefail
          for key in flutter cmake ninja jdk androidNdk xcode; do
            output_name="$key"
            [[ "$key" == "androidNdk" ]] && output_name="android_ndk"
            printf '%s=%s\n' "$output_name" "$(jq -r ".toolchains.${key}" native/dependencies.lock.json)" >> "$GITHUB_OUTPUT"
          done

      - name: Select pinned Xcode
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ steps.unix_toolchains.outputs.xcode }}'
          major_minor="${expected%.*}"
          developer_dir="/Applications/Xcode_${major_minor}.app/Contents/Developer"
          [[ -d "$developer_dir" ]] || { echo "Pinned Xcode is missing: $developer_dir" >&2; exit 69; }
          printf 'DEVELOPER_DIR=%s\n' "$developer_dir" >> "$GITHUB_ENV"
          actual="$(DEVELOPER_DIR="$developer_dir" xcodebuild -version | awk 'NR == 1 {print $2}')"
          [[ "$actual" == "$expected" ]] || { echo "Xcode mismatch: $actual" >&2; exit 69; }
          [[ "$(uname -m)" == "arm64" ]] || { echo "macos-26 must be an ARM64 runner." >&2; exit 69; }

      - name: Install pinned Flutter (Windows)
        if: matrix.platform == 'windows'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.windows_toolchains.outputs.flutter }}
          channel: stable
          cache: false

      - name: Install pinned Flutter (Unix)
        if: matrix.platform != 'windows'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.unix_toolchains.outputs.flutter }}
          channel: stable
          cache: false

      - name: Install pinned CMake and Ninja (Windows)
        if: matrix.platform == 'windows'
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ steps.windows_toolchains.outputs.cmake }}
          ninjaVersion: ${{ steps.windows_toolchains.outputs.ninja }}
          useCloudCache: false
          useLocalCache: false

      - name: Install pinned CMake and Ninja (Unix)
        if: matrix.platform != 'windows'
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ steps.unix_toolchains.outputs.cmake }}
          ninjaVersion: ${{ steps.unix_toolchains.outputs.ninja }}
          useCloudCache: false
          useLocalCache: false

      - name: Select pinned MSVC and Windows SDK
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: amd64
          toolset: ${{ steps.windows_toolchains.outputs.msvc }}
          sdk: ${{ steps.windows_toolchains.outputs.windows_sdk }}

      - name: Install pinned JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.unix_toolchains.outputs.jdk }}

      - name: Configure Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;${{ steps.unix_toolchains.outputs.android_ndk }}"
          printf 'ANDROID_NDK_ROOT=%s/ndk/%s\n' "$ANDROID_SDK_ROOT" '${{ steps.unix_toolchains.outputs.android_ndk }}' >> "$GITHUB_ENV"
          printf 'ANDROID_NDK=%s/ndk/%s\n' "$ANDROID_SDK_ROOT" '${{ steps.unix_toolchains.outputs.android_ndk }}' >> "$GITHUB_ENV"

      - name: Assert Windows toolchains
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          # A fresh Flutter SDK bootstraps its tool on the first invocation and
          # writes progress text to stdout. Warm it before requesting JSON so
          # that bootstrap output cannot contaminate the machine response.
          flutter --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Flutter bootstrap failed with exit code $LASTEXITCODE" }
          $flutterOutput = flutter --version --machine | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Flutter version query failed with exit code $LASTEXITCODE" }
          $jsonStart = $flutterOutput.IndexOf('{')
          $jsonEnd = $flutterOutput.LastIndexOf('}')
          if ($jsonStart -lt 0 -or $jsonEnd -lt $jsonStart) {
            throw "Flutter machine response did not contain a JSON object: $flutterOutput"
          }
          $flutterJson = $flutterOutput.Substring($jsonStart, $jsonEnd - $jsonStart + 1)
          $flutter = ($flutterJson | ConvertFrom-Json -ErrorAction Stop).frameworkVersion
          if ([string]::IsNullOrWhiteSpace($flutter)) { throw "Flutter machine response omitted frameworkVersion" }
          if ($flutter -ne '${{ steps.windows_toolchains.outputs.flutter }}') { throw "Flutter mismatch: $flutter" }
          $cmake = ((cmake --version)[0] -split ' ')[2]
          if ($cmake -ne '${{ steps.windows_toolchains.outputs.cmake }}') { throw "CMake mismatch: $cmake" }
          $ninja = (ninja --version).Trim()
          if ($ninja -ne '${{ steps.windows_toolchains.outputs.ninja }}') { throw "Ninja mismatch: $ninja" }
          if (-not $env:VCToolsVersion.StartsWith('${{ steps.windows_toolchains.outputs.msvc }}.')) {
            throw "MSVC mismatch: $env:VCToolsVersion"
          }
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          if ($sdk -ne '${{ steps.windows_toolchains.outputs.windows_sdk }}') { throw "Windows SDK mismatch: $sdk" }

      - name: Assert Unix toolchains
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          # Avoid mixing first-run Flutter bootstrap progress with machine JSON.
          flutter --version >/dev/null
          flutter_json="$(flutter --version --machine)"
          flutter_version="$(printf '%s\n' "$flutter_json" | jq -er '.frameworkVersion')"
          [[ "$flutter_version" == '${{ steps.unix_toolchains.outputs.flutter }}' ]] || {
            echo "Flutter mismatch: $flutter_version" >&2
            exit 69
          }
          [[ "$(cmake --version | awk 'NR == 1 {print $3}')" == '${{ steps.unix_toolchains.outputs.cmake }}' ]]
          [[ "$(ninja --version)" == '${{ steps.unix_toolchains.outputs.ninja }}' ]]
          if [[ '${{ matrix.platform }}' == android ]]; then
            java_spec="$(java -XshowSettings:properties -version 2>&1 | awk -F= '/java[.]specification[.]version/ {gsub(/[[:space:]]/, "", $2); print $2; exit}')"
            [[ "$java_spec" == '${{ steps.unix_toolchains.outputs.jdk }}' ]]
            if ! ndk_revision="$(awk -F= '
              function trim(value) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", value)
                return value
              }
              {
                raw = trim($0)
                key = trim($1)
                if ((raw ~ /^Pkg[.]BaseRevision([[:space:]]|:|$)/ && key != "Pkg.BaseRevision") ||
                    (raw ~ /^Pkg[.]Revision([[:space:]]|:|$)/ && key != "Pkg.Revision")) {
                  invalid = 1
                }
                if (key == "Pkg.BaseRevision") {
                  base_count++
                  if (NF != 2 || base_count != 1) invalid = 1
                  base = trim($2)
                } else if (key == "Pkg.Revision") {
                  revision_count++
                  if (NF != 2 || revision_count != 1) invalid = 1
                  revision = trim($2)
                }
              }
              END {
                if (invalid || base_count > 1 || revision_count > 1) exit 2
                if (base_count == 1) {
                  if (base == "") exit 2
                  print base
                  exit
                }
                if (revision_count == 1 && revision != "") {
                  print revision
                  exit
                }
                exit 2
              }
            ' "$ANDROID_NDK_ROOT/source.properties")"; then
              echo "Android NDK source.properties has missing, duplicate, or malformed revision metadata." >&2
              exit 69
            fi
            [[ "$ndk_revision" == '${{ steps.unix_toolchains.outputs.android_ndk }}' ]] || {
              echo "Android NDK mismatch: $ndk_revision" >&2
              exit 69
            }
          else
            [[ "$(xcodebuild -version | awk 'NR == 1 {print $2}')" == '${{ steps.unix_toolchains.outputs.xcode }}' ]]
          fi

      - name: Configure Flutter Apple builds
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          flutter config --enable-macos-arm64-only

      - name: Verify Windows bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\tool\native.ps1 verify windows

      - name: Build and smoke-test Windows consumer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:SIMPLE_TORRENT_TEST_FILE = 'integration_test/plugin_integration_test.dart'
          $env:SIMPLE_TORRENT_DIAGNOSTICS_SUITE = 'native-init-smoke'
          .\tool\test-sample.ps1 windows -BuildMode release
          Remove-Item Env:SIMPLE_TORRENT_TEST_FILE
          .\tool\test-suspension.ps1 windows -BuildMode debug

      - name: Verify all Android ABIs
        if: matrix.platform == 'android'
        shell: bash
        run: ./tool/native.sh verify android

      - name: Enable Android emulator KVM access
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          [[ -c /dev/kvm ]] || {
            echo '/dev/kvm is unavailable on this runner.' >&2
            exit 69
          }
          sudo chmod 0666 /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]] || {
            echo 'The Android smoke runner cannot read and write /dev/kvm.' >&2
            exit 69
          }
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check

      - name: Build and smoke-test Android x86_64 consumer
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -accel on -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: SIMPLE_TORRENT_TEST_FILE=integration_test/plugin_integration_test.dart SIMPLE_TORRENT_DIAGNOSTICS_SUITE=native-init-smoke ./tool/test-sample.sh android release && ./tool/test-suspension.sh android debug

      - name: Verify macOS ARM bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: ./tool/native.sh verify macos

      - name: Build and smoke-test macOS ARM consumer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          SIMPLE_TORRENT_TEST_FILE=integration_test/plugin_integration_test.dart SIMPLE_TORRENT_DIAGNOSTICS_SUITE=native-init-smoke ./tool/test-sample.sh macos release
          ./tool/test-suspension.sh macos debug

      - name: Verify iOS ARM bundle
        if: matrix.platform == 'ios'
        shell: bash
        run: ./tool/native.sh verify ios

      - name: Boot a fresh dedicated iOS ARM simulator
        if: matrix.platform == 'ios'
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          simulator_sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="$(xcrun simctl list runtimes --json | jq -r \
            --arg version "$simulator_sdk" \
            '[.runtimes[] | select(
              .isAvailable == true and
              (.version == $version or (.version | startswith($version + "."))) and
              (.identifier | contains("SimRuntime.iOS"))
            )] | (first // {}) | .identifier // empty')"
          [[ -n "$runtime" ]] || {
            echo "No available iOS $simulator_sdk Simulator runtime for the pinned Xcode." >&2
            exit 69
          }
          # Copy only the device type from an image-provided device for this
          # exact runtime. Reusing that device's UDID proved vulnerable to
          # stale boot/log-reader state, while choosing an arbitrary type is
          # not guaranteed to be compatible with older pinned runtimes.
          device_type="$(xcrun simctl list devices available --json | jq -r --arg runtime "$runtime" \
            '(.devices[$runtime] // []) | map(select(.isAvailable == true and (.name | startswith("iPhone")))) | (first // {}) | .deviceTypeIdentifier // empty')"
          [[ -n "$device_type" ]] || {
            echo "No compatible iPhone Simulator device type for $runtime." >&2
            exit 69
          }
          simulator_name="SimpleTorrent-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          udid="$(xcrun simctl create "$simulator_name" "$device_type" "$runtime")"
          [[ -n "$udid" ]] || { echo 'Could not create the dedicated iOS Simulator.' >&2; exit 69; }
          # Persist the identifier before booting so the always() cleanup can
          # delete even a device whose boot or readiness check fails.
          printf 'SIMPLE_TORRENT_DEVICE_ID=%s\n' "$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Build iOS Release and run Simulator Debug XCTest init smoke
        if: matrix.platform == 'ios'
        shell: bash
        timeout-minutes: 50
        run: |
          set -euo pipefail
          SIMPLE_TORRENT_PREFLIGHT_TIMEOUT_MINUTES=3 SIMPLE_TORRENT_BUILD_TIMEOUT_MINUTES=15 SIMPLE_TORRENT_PROCESS_TIMEOUT_MINUTES=10 SIMPLE_TORRENT_TEST_TIMEOUT_MINUTES=5 SIMPLE_TORRENT_TEST_FILE=integration_test/plugin_integration_test.dart SIMPLE_TORRENT_DIAGNOSTICS_SUITE=native-init-smoke ./tool/test-sample.sh ios release

      - name: Run iOS Simulator XCTest deterministic suspension smoke
        if: matrix.platform == 'ios'
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          SIMPLE_TORRENT_PREFLIGHT_TIMEOUT_MINUTES=3 SIMPLE_TORRENT_BUILD_TIMEOUT_MINUTES=15 SIMPLE_TORRENT_PROCESS_TIMEOUT_MINUTES=10 ./tool/test-suspension.sh ios debug

      - name: Capture iOS Simulator failure diagnostics
        if: (failure() || cancelled()) && matrix.platform == 'ios'
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          diagnostics_root=build/native-smoke/ios-simulator
          mkdir -p "$diagnostics_root"
          if [[ -n "${SIMPLE_TORRENT_DEVICE_ID:-}" ]]; then
            python3 tool/run_with_timeout.py 60 \
              xcrun simctl spawn "$SIMPLE_TORRENT_DEVICE_ID" log show \
              --last 30m --style compact --predicate 'process == "Runner"' \
              > "$diagnostics_root/runner.log" 2>&1
            python3 tool/run_with_timeout.py 60 \
              xcrun simctl io "$SIMPLE_TORRENT_DEVICE_ID" screenshot \
              "$diagnostics_root/screenshot.png" \
              > "$diagnostics_root/screenshot.log" 2>&1
            python3 tool/run_with_timeout.py 60 \
              xcrun simctl listapps "$SIMPLE_TORRENT_DEVICE_ID" \
              > "$diagnostics_root/apps.txt" 2>&1
          fi
          python3 tool/run_with_timeout.py 60 xcrun simctl list devices --json \
            > "$diagnostics_root/devices.json" 2>&1
          exit 0

      - name: Shut down iOS Simulator
        if: always() && matrix.platform == 'ios'
        shell: bash
        timeout-minutes: 5
        run: |
          if [[ -n "${SIMPLE_TORRENT_DEVICE_ID:-}" ]]; then
            python3 tool/run_with_timeout.py 60 \
              xcrun simctl shutdown "$SIMPLE_TORRENT_DEVICE_ID" \
              2>/dev/null || true
            python3 tool/run_with_timeout.py 60 \
              xcrun simctl delete "$SIMPLE_TORRENT_DEVICE_ID" \
              2>/dev/null || true
          fi

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-bundle-smoke-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/native-*-smoke
            build/test-sample
            build/test-suspension
            build/native-smoke

  native-bundle-gate:
    name: native-bundle-gate
    if: always()
    needs:
      - classify
      - build-candidate
      - smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Resolve aggregate smoke result
        shell: bash
        env:
          BUNDLE: ${{ needs.classify.outputs.bundle }}
          SOURCE: ${{ needs.classify.outputs.source }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          BUILD_CANDIDATE_RESULT: ${{ needs.build-candidate.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          if [[ "$CLASSIFY_RESULT" != success ]]; then
            echo "Native-change classification did not succeed: $CLASSIFY_RESULT" >&2
            exit 1
          fi

          if [[ "$SOURCE" == true ]]; then
            if [[ "$BUILD_CANDIDATE_RESULT" != success ]]; then
              echo "Candidate native-bundle build did not succeed: $BUILD_CANDIDATE_RESULT" >&2
              exit 1
            fi
          elif [[ "$BUILD_CANDIDATE_RESULT" != skipped ]]; then
            echo "Candidate native-bundle build had an unexpected result: $BUILD_CANDIDATE_RESULT" >&2
            exit 1
          fi

          if [[ "$SOURCE" != true && "$BUNDLE" != true ]]; then
            echo 'No canonical native inputs or committed native-bundle files changed; the gate passes without platform jobs.'
            exit 0
          fi

          if [[ "$SMOKE_RESULT" != success ]]; then
            echo "At least one native-bundle platform smoke failed: $SMOKE_RESULT" >&2
            exit 1
          fi
          echo 'All Windows, Android, macOS ARM, and iOS ARM smoke checks passed.'
