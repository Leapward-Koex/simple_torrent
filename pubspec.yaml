name: simple_torrent_workspace
description: Development workspace for the simple_torrent federated Flutter plugin.
publish_to: none

environment:
  sdk: '>=3.13.0 <4.0.0'

workspace:
  - packages/simple_torrent
  - packages/simple_torrent_platform_interface
  - packages/simple_torrent_android
  - packages/simple_torrent_ios
  - packages/simple_torrent_macos
  - packages/simple_torrent_windows
  - packages/simple_torrent/example

dev_dependencies:
  flutter_lints: ^6.0.0
