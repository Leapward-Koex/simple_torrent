name: simple_torrent_ios
description: iOS implementation of simple_torrent, distributed with a bundled static native XCFramework.
version: 2.0.0
homepage: https://github.com/Leapward-Koex/simple_torrent
repository: https://github.com/Leapward-Koex/simple_torrent/tree/master/packages/simple_torrent_ios
issue_tracker: https://github.com/Leapward-Koex/simple_torrent/issues
topics:
  - bittorrent
  - torrent
  - ios

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  simple_torrent_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: simple_torrent
    platforms:
      ios:
        pluginClass: SimpleTorrentPlugin
        dartPluginClass: SimpleTorrentIOS
